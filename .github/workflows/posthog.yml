name: PostHog

# Keeps PostHog's usage dashboard in line with posthog/ (DESIGN.md 7.11):
# plans on pull requests that change it, applies on pushes to main. State is
# in Cloudflare R2, locked while a run uses it. Dependabot's pull requests get
# the same secrets from the repository's Dependabot secrets, so its provider
# updates are planned too.

on:
  push:
    branches: [main]
    paths:
      - "posthog/**"
      - "src/analytics-events.ts"
      - "MODULE.bazel"
      - "MODULE.bazel.lock"
      - ".github/workflows/posthog.yml"
  pull_request:
    paths:
      - "posthog/**"
      - "src/analytics-events.ts"
      - "MODULE.bazel"
      - "MODULE.bazel.lock"
      - ".github/workflows/posthog.yml"
  workflow_dispatch:

permissions:
  contents: read

# Plans and applies queue separately. GitHub keeps only one waiting run per
# group, replacing it with any newer one, so a shared group would cancel one
# pull request's plan when another's queued.
# - Pull requests: one plan each, and a new push cancels the old plan. Plans
#   only read the state, so they take no lock (-lock=false): a cancelled plan
#   can't leave it held, and plans never wait on an apply.
# - Applies: one at a time and never cancelled, because an apply stopped
#   half-way leaves the dashboard half-changed (and the state lock held). A
#   waiting apply that's replaced loses nothing: the newer one applies a main
#   that has its changes too.
# An apply waits for the state lock (-lock-timeout) if someone holds it, for
# example posthog/run.sh from termina, instead of failing on it.
concurrency:
  group: posthog-${{ github.event_name == 'pull_request' && format('plan-{0}', github.event.pull_request.number) || 'apply' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  posthog:
    # Pull requests from forks get no secrets, so there's nothing to plan with.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: bazel-contrib/setup-bazel@0.19.1
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true
      - name: Check the queries against PostHog
        run: bazel run //posthog:check_queries
      - name: Plan
        if: github.event_name == 'pull_request'
        run: bazel run //posthog:posthog.plan -- -lock=false -no-color
      - name: Apply
        if: github.event_name != 'pull_request'
        run: bazel run //posthog:posthog.apply -- -lock-timeout=15m -auto-approve -no-color
