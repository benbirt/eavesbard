name: Update track index

on:
  schedule:
    - cron: "17 6 * * 1" # Mondays, 06:17 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-index

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true
      - name: Regenerate data/tracks.json
        run: bazel run --noshow_progress --ui_event_filters=-info,-debug //scripts:build_index 2>&1 | tee "$RUNNER_TEMP/index.log"
      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet -- data/tracks.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --stat -- data/tracks.json
          fi
      # Pull requests opened with GITHUB_TOKEN don't trigger the CI workflow,
      # so the new index is tested here before the pull request is opened.
      - name: Test
        if: steps.diff.outputs.changed == 'true'
        run: bazel test //...
      - name: Open or update pull request
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch=update-track-index
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$branch"
          git commit -m "Update track index from tabletopaudio.com" -- data/tracks.json
          git push --force origin "$branch"
          body="$(printf 'Regenerated by the [Update track index](%s) workflow; tests passed in that run.\n\n```\n%s\n```\n' \
            "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" "$(cat "$RUNNER_TEMP/index.log")")"
          if [ -z "$(gh pr list --head "$branch" --state open --json number --jq '.[].number')" ]; then
            gh pr create --head "$branch" --title "Update track index" --body "$body"
          else
            gh pr edit "$branch" --body "$body"
          fi
