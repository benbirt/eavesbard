name: DNS

# Keeps eavesbard.com's DNS records in Cloudflare in line with dns/
# (DESIGN.md 8): plans on pull requests that change them, applies on pushes to
# main. State is in Cloudflare R2, beside the PostHog configuration's, and the
# concurrency rules are the same as in posthog.yml, which explains them.

on:
  push:
    branches: [main]
    paths:
      - "dns/**"
      - "versions.tf"
      - ".terraform.lock.hcl"
      - "MODULE.bazel"
      - "MODULE.bazel.lock"
      - ".github/workflows/dns.yml"
  pull_request:
    paths:
      - "dns/**"
      - "versions.tf"
      - ".terraform.lock.hcl"
      - "MODULE.bazel"
      - "MODULE.bazel.lock"
      - ".github/workflows/dns.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dns-${{ github.event_name == 'pull_request' && format('plan-{0}', github.event.pull_request.number) || 'apply' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  dns:
    # Pull requests from forks get no secrets, so there's nothing to plan with.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: bazel-contrib/setup-bazel@0.19.1
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true
      - name: Plan
        if: github.event_name == 'pull_request'
        run: bazel run //dns:dns.plan -- -lock=false -no-color
      - name: Apply
        if: github.event_name != 'pull_request'
        run: bazel run //dns:dns.apply -- -lock-timeout=15m -auto-approve -no-color
