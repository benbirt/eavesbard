# Weekly version updates, one pull request per ecosystem (and per pnpm
# workspace) so the shared lockfiles don't conflict between them.
#
# Not covered: .bazelversion and, in MODULE.bazel, the bazel_dep versions and
# the Node version, which bazel-updates.yaml advances (Dependabot cannot
# evaluate a MODULE.bazel whose rules_js extensions read package.json).
version: 2
updates:
  # package.json and pnpm-lock.yaml: the app's, and the experiments' own.
  - package-ecosystem: npm
    directories:
      - /
      - /experiments
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ["*"]
        update-types: [minor, patch]

  # The OpenTofu providers (PostHog, Cloudflare): their versions in
  # versions.tf and the lock beside it, both at the root, which rules_tofu
  # reads (tf_providers.from_lock in MODULE.bazel). Dependabot reads only the
  # .tf files in this directory, so posthog/ and dns/ declare just a floor.
  # "opentofu", not "terraform", which can't read an OpenTofu lock.
  - package-ecosystem: opentofu
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
