<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Eavesbard</title>
    <link rel="preload" href="fonts/cinzel-latin.woff2" as="font" type="font/woff2" crossorigin />
    <style>
      /* Cinzel (SIL Open Font License, fonts/OFL.txt), served from this site. */
      @font-face {
        font-family: "Cinzel";
        font-style: normal;
        font-weight: 400 900;
        font-display: swap;
        src: url(fonts/cinzel-latin.woff2) format("woff2");
      }
      :root {
        color-scheme: dark;
        --bg: #0e0d0b;
        --fg: #f1ece2;
        --muted: #b3aa9a;
        --glass: rgba(18, 16, 13, 0.72);
        --glass-strong: rgba(18, 16, 13, 0.92);
        --line: rgba(241, 236, 226, 0.14);
        --field: rgba(0, 0, 0, 0.35);
        --ok: #6fcf8a;
        --warn: #e0a94a;
        --error: #f08a7e;
        --accent: #7fb59c;
        --accent-ink: #0e0d0b;
        --radius: 14px;
        --display: "Cinzel", Georgia, serif;
        --ui: system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      /* The intensity colours the controls, never the art. */
      body[data-intensity="tense"] {
        --accent: #e0a94a;
      }
      body[data-intensity="combat"] {
        --accent: #e0574e;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        min-height: 100%;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        font: 15px/1.45 var(--ui);
        overflow-x: hidden;
      }
      button,
      input,
      select {
        font: inherit;
        color: inherit;
      }
      button:not(:disabled) {
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.45;
      }
      :focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      a {
        color: var(--accent);
      }
      .small,
      small {
        font-size: 13px;
        color: var(--muted);
      }
      .other-tabs {
        margin-top: 12px;
      }
      .other-tabs p {
        margin: 0 0 8px !important;
      }
      .download-offer {
        margin-top: 12px;
      }
      .download-offer p {
        margin: 6px 0 0 !important;
      }
      .saved-key {
        color: var(--ok, #7fb59c);
      }
      .badge-small {
        display: inline-block;
        margin-right: 6px;
        padding: 0 6px;
        border: 1px solid var(--line);
        border-radius: 6px;
        font-size: 11px;
        color: var(--muted);
      }
      .warning {
        color: var(--warn);
      }
      [hidden] {
        display: none !important;
      }

      /* A blurred copy of the art behind the whole page. */
      .ambient {
        position: fixed;
        inset: 0;
        z-index: 0;
        overflow: hidden;
      }
      .ambient img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        filter: blur(40px) saturate(1.1) brightness(0.45);
        transform: scale(1.2);
      }
      .ambient::after {
        content: "";
        position: absolute;
        inset: 0;
        background: radial-gradient(ellipse at 50% 30%, transparent 0, rgba(14, 13, 11, 0.55) 70%);
      }
      .app {
        position: relative;
        z-index: 1;
        max-width: 1500px;
        margin: 0 auto;
      }

      /* Top bar. */
      .top {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 12px 20px;
        flex-wrap: wrap;
      }
      .brand-block {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        margin-right: auto;
        padding: 0;
        background: none;
        border: 0;
        color: inherit;
        text-align: left;
        cursor: pointer;
      }
      .brand {
        font-family: var(--display);
        font-weight: 700;
        font-size: 20px;
        letter-spacing: 0.06em;
      }
      .tagline {
        font-size: 12px;
        color: var(--muted);
      }
      .brand-block:hover .tagline {
        text-decoration: underline;
      }
      /* Lists in the panels read like the paragraphs around them. */
      .steps {
        padding-left: 20px;
        margin: 6px 0;
        color: var(--muted);
        font-size: 13px;
      }
      .steps li {
        margin: 4px 0;
      }
      .steps b {
        color: var(--fg);
        font-weight: 600;
      }
      .github-link {
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }
      .github-link svg {
        width: 16px;
        height: 16px;
      }
      .chip {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        padding: 5px 11px;
        border-radius: 999px;
        background: var(--glass);
        border: 1px solid var(--line);
        font-size: 13px;
        color: var(--muted);
        max-width: 26rem;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .chip b {
        color: var(--fg);
        font-weight: 600;
      }
      .chip .dot {
        flex: none;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #888;
      }
      .chip.ok .dot {
        background: var(--ok);
      }
      /* Listening: red, like a browser's recording indicator. */
      .chip.rec .dot {
        background: #e5484d;
      }
      .chip.busy .dot {
        background: var(--accent);
        animation: blink 1.2s infinite;
      }
      .chip.warn {
        border-color: var(--warn);
      }
      .chip.warn .dot {
        background: var(--warn);
      }
      .dot.hearing {
        animation: pulse 1.4s infinite;
      }
      @keyframes pulse {
        0% {
          box-shadow: 0 0 0 0 rgba(111, 207, 138, 0.6);
        }
        70% {
          box-shadow: 0 0 0 8px rgba(111, 207, 138, 0);
        }
        100% {
          box-shadow: 0 0 0 0 rgba(111, 207, 138, 0);
        }
      }
      @keyframes blink {
        50% {
          opacity: 0.35;
        }
      }
      .iconbtn {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 7px 12px;
        border-radius: 10px;
        background: var(--glass);
        border: 1px solid var(--line);
      }
      .iconbtn:hover {
        border-color: var(--accent);
      }
      .iconbtn svg {
        width: 17px;
        height: 17px;
      }
      a.iconbtn {
        color: inherit;
        text-decoration: none;
      }
      .iconbtn.cast {
        padding: 7px 10px;
      }
      .iconbtn.cast svg {
        width: 20px;
        height: 20px;
      }
      .iconbtn.cast[aria-pressed="true"] {
        color: var(--accent);
        border-color: var(--accent);
      }
      .iconbtn:disabled {
        opacity: 0.45;
      }

      /* Stage: the art, and the column beside it. */
      .stage {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 360px;
        gap: 20px;
        padding: 4px 20px 24px;
        align-items: start;
      }
      .frame {
        margin: 0;
      }
      .frame .art {
        position: relative;
        aspect-ratio: 16 / 10;
        max-height: calc(100vh - 120px);
        width: 100%;
        border-radius: var(--radius);
        overflow: hidden;
        background: #000;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
      }
      .frame .fill {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        filter: blur(22px) brightness(0.5);
        transform: scale(1.15);
      }
      .frame .img {
        position: relative;
        display: block;
        width: 100%;
        height: 100%;
        /* Whole image, never cropped or covered: signatures and copyright lines stay visible. */
        object-fit: contain;
      }
      .credit {
        margin-top: 8px;
        font-size: 12px;
        color: var(--muted);
      }
      .col {
        display: grid;
        gap: 14px;
      }
      .card {
        background: var(--glass);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        padding: 16px;
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
      }
      .card p {
        margin: 0;
      }
      .eyebrow {
        font-size: 12px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted);
        margin: 0 0 6px !important;
      }
      .scene-name {
        font-family: var(--display);
        font-size: 30px;
        line-height: 1.1;
        margin: 0;
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
      }
      .badge {
        font-family: var(--ui);
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        padding: 3px 10px;
        border-radius: 999px;
        background: var(--accent);
        color: var(--accent-ink);
      }
      .why {
        margin-top: 8px !important;
        color: var(--muted);
        font-size: 14px;
        overflow-wrap: anywhere;
      }
      .meta {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        margin-top: 12px;
        font-size: 13px;
        color: var(--muted);
      }
      .bar {
        height: 4px;
        border-radius: 2px;
        background: var(--line);
        overflow: hidden;
        margin-top: 6px;
      }
      .bar i {
        display: block;
        height: 100%;
        background: var(--accent);
        transition: width 1s linear;
      }
      /* While a track loads: a band sweeping across the bar. */
      .bar.loading i {
        width: 30%;
        transition: none;
        animation: sweep 1.2s ease-in-out infinite;
      }
      @keyframes sweep {
        from {
          transform: translateX(-100%);
        }
        to {
          transform: translateX(340%);
        }
      }
      .src .loading {
        color: var(--accent);
      }
      /* An invisible range input over the progress bar, for seeking. */
      .seek {
        position: relative;
        margin-top: 6px;
        padding-block: 6px;
        margin-block: 0 -6px;
      }
      .seek .bar {
        margin-top: 0;
      }
      .seek input[type="range"] {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        margin: 0;
        opacity: 0;
        cursor: pointer;
      }
      .seek:hover .bar,
      .seek:has(input:focus-visible) .bar {
        height: 6px;
        margin-block: -1px;
        border-radius: 3px;
      }
      .seek:has(input:focus-visible) .bar {
        outline: 2px solid var(--accent);
        outline-offset: 3px;
      }
      /* The scene card's status: the next check, and changes in waiting. */
      .status {
        margin-top: 12px;
        padding: 10px 12px;
        border-radius: 10px;
        background: rgb(255 255 255 / 0.04);
        font-size: 13px;
      }
      .status .next {
        color: var(--muted);
      }
      .bar.thin {
        height: 2px;
        margin-top: 6px;
      }
      .pending {
        margin-top: 6px !important;
        font-size: 13px;
        color: var(--accent);
      }
      .override {
        margin-top: 14px;
        border-top: 1px solid var(--line);
        padding-top: 12px;
      }
      .override p {
        margin: 0 0 8px;
        font-size: 12px;
        color: var(--muted);
      }
      .pills {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-bottom: 6px;
      }
      .pill {
        padding: 4px 10px;
        border-radius: 999px;
        border: 1px solid var(--line);
        background: transparent;
        font-size: 13px;
        color: var(--muted);
      }
      .pill[aria-pressed="true"] {
        border-color: var(--accent);
        color: var(--fg);
        background: color-mix(in srgb, var(--accent) 20%, transparent);
      }
      .track {
        font-family: var(--display);
        font-size: 19px;
      }
      .src {
        color: var(--muted);
        font-size: 13px;
      }
      .transport {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-top: 12px;
      }
      .round {
        width: 40px;
        height: 40px;
        flex: none;
        border-radius: 50%;
        display: grid;
        place-items: center;
        background: transparent;
        border: 1px solid var(--line);
      }
      .round.primary {
        background: var(--accent);
        color: var(--accent-ink);
        border: none;
      }
      .round svg {
        width: 18px;
        height: 18px;
      }
      input[type="range"] {
        accent-color: var(--accent);
        flex: 1;
        min-width: 60px;
      }
      .stop {
        width: 100%;
        padding: 10px;
        border-radius: 10px;
        border: 1px solid var(--line);
        background: var(--glass);
        color: var(--muted);
      }
      .stop:hover {
        border-color: #e0574e;
        color: var(--fg);
      }

      /* Before a session. */
      .start h2 {
        font-family: var(--display);
        font-size: 26px;
        margin: 0 0 6px;
      }
      .start > p {
        margin: 0 0 14px;
        color: var(--muted);
      }
      .start input[type="text"],
      .field {
        width: 100%;
        padding: 10px 12px;
        border-radius: 10px;
        border: 1px solid var(--line);
        background: var(--field);
      }
      .begin {
        width: 100%;
        margin-top: 12px;
        padding: 13px;
        border-radius: 10px;
        border: none;
        background: var(--accent);
        color: var(--accent-ink);
        font-weight: 700;
        font-size: 16px;
      }

      /* Side panels. */
      .scrim {
        position: fixed;
        inset: 0;
        z-index: 4;
        background: rgb(0 0 0 / 0.25);
      }
      .drawer {
        position: fixed;
        top: 0;
        right: 0;
        bottom: 0;
        width: min(440px, 100vw);
        z-index: 5;
        background: var(--glass-strong);
        border-left: 1px solid var(--line);
        backdrop-filter: blur(18px);
        -webkit-backdrop-filter: blur(18px);
        transform: translateX(100%);
        visibility: hidden;
        transition:
          transform 0.25s ease,
          visibility 0.25s;
        display: flex;
        flex-direction: column;
      }
      .drawer.open {
        transform: none;
        visibility: visible;
      }
      .drawer header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 16px 18px;
        border-bottom: 1px solid var(--line);
      }
      .tabs {
        display: flex;
        gap: 16px;
      }
      .tab {
        background: none;
        border: none;
        padding: 0 0 2px;
        font-family: var(--display);
        font-size: 19px;
        color: var(--muted);
        border-bottom: 2px solid transparent;
      }
      .tab[aria-current="page"] {
        color: var(--fg);
        border-bottom-color: var(--accent);
      }
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip-path: inset(50%);
        white-space: nowrap;
      }
      .drawer h2:focus {
        outline: none;
      }
      .drawer .body {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        padding: 14px 18px 24px;
      }
      .close {
        background: none;
        border: none;
        font-size: 24px;
        line-height: 1;
        color: var(--muted);
      }
      .btn {
        padding: 7px 12px;
        border-radius: 8px;
        border: 1px solid var(--line);
        background: transparent;
        font-size: 13px;
      }
      .btn:hover {
        border-color: var(--accent);
      }
      .section {
        padding: 14px 0;
        border-bottom: 1px solid var(--line);
      }
      .section h3 {
        margin: 0 0 8px;
        font-size: 15px;
      }
      .section p {
        margin: 6px 0;
        color: var(--muted);
        font-size: 13px;
      }
      .section label {
        display: block;
        margin: 8px 0;
      }
      .toggle {
        display: flex !important;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
        margin: 0 !important;
      }
      .toggle h3 {
        margin: 0;
      }
      .debug summary {
        cursor: pointer;
      }
      .debug summary h3 {
        display: inline;
      }
      .debug .toggle {
        margin-top: 10px !important;
      }
      .radio {
        display: flex !important;
        gap: 10px;
        align-items: flex-start;
        padding: 8px 10px;
        border: 1px solid var(--line);
        border-radius: 10px;
        margin: 6px 0 !important;
      }
      .radio:has(input:checked) {
        border-color: var(--accent);
      }
      .radio small {
        display: block;
      }
      .key label input {
        margin-top: 4px;
      }
      .credits {
        font-size: 12px;
        color: var(--muted);
        padding-left: 18px;
        margin: 4px 0 6px;
      }
      .row {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      .row label {
        flex: 1 1 10rem;
      }
      select:not(.field) {
        padding: 6px 8px;
        border-radius: 8px;
        border: 1px solid var(--line);
        background: var(--field);
        max-width: 100%;
      }
      google-cast-launcher {
        display: inline-block;
        width: 28px;
        height: 28px;
        vertical-align: middle;
      }


      /* Session log. */
      .log {
        list-style: none;
        margin: 10px 0;
        padding: 0;
      }
      .log li {
        display: grid;
        grid-template-columns: 44px 22px 1fr;
        gap: 6px;
        padding: 7px 2px;
        border-bottom: 1px solid var(--line);
        font-size: 13px;
        overflow-wrap: anywhere;
      }
      .log time {
        color: var(--muted);
        font-variant-numeric: tabular-nums;
      }
      .log .kind-speech .body {
        font-style: italic;
      }
      .log .kind-decision strong {
        color: var(--accent);
      }
      .log .muted {
        color: var(--muted);
      }
      .log details summary {
        cursor: pointer;
        color: var(--muted);
      }
      .log pre {
        white-space: pre-wrap;
        font-size: 12px;
        background: rgba(0, 0, 0, 0.3);
        padding: 8px;
        border-radius: 6px;
      }
      .dropped {
        text-decoration: line-through;
        opacity: 0.6;
      }
      .event-log {
        font: 12px ui-monospace, monospace;
        color: var(--muted);
        max-height: 14rem;
        overflow: auto;
        padding-left: 1.2rem;
      }

      /*
       * Wide screens: the page fits the window and never scrolls. The art
       * takes the height that's left (still whole, letterboxed against its
       * blurred copy); the side column scrolls within itself if it must.
       */
      @media (min-width: 861px) {
        .app {
          height: 100vh;
          height: 100dvh;
          display: flex;
          flex-direction: column;
        }
        .stage {
          flex: 1;
          min-height: 0;
          grid-template-rows: minmax(0, 1fr);
          align-items: stretch;
          padding-bottom: 14px;
        }
        .frame {
          display: flex;
          flex-direction: column;
          min-height: 0;
        }
        .frame .art {
          flex: 1;
          min-height: 0;
          aspect-ratio: auto;
          max-height: none;
        }
        .col {
          min-height: 0;
          overflow-y: auto;
          align-content: start;
          scrollbar-width: thin;
        }
      }

      /* Narrow screens: one column. */
      @media (max-width: 860px) {
        .stage {
          grid-template-columns: 1fr;
        }
        .top .chip.model {
          display: none;
        }
        .tagline {
          display: none;
        }
      }
      @media (max-width: 520px) {
        .top {
          padding: 10px 12px;
        }
        .stage {
          padding: 4px 12px 20px;
        }
        .brand {
          font-size: 17px;
        }
        .scene-name {
          font-size: 24px;
        }
        .chip {
          order: 3;
          max-width: 100%;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .drawer,
        .bar i {
          transition: none;
        }
        .dot.hearing,
        .chip.busy .dot,
        .bar.loading i {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./main.js"></script>
  </body>
</html>
