<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Eavesbard</title>
    <style>
      :root {
        color-scheme: light dark;
        --fg: #1d1d1f;
        --bg: #fafaf7;
        --muted: #6b6b70;
        --border: #d8d8d2;
        --error: #b3261e;
        --ok: #1e7a3c;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --fg: #ececea;
          --bg: #18181a;
          --muted: #a0a0a6;
          --border: #3a3a3e;
          --error: #f2b8b5;
          --ok: #8fd6a4;
        }
      }
      body {
        margin: 0 auto;
        max-width: 48rem;
        padding: 1rem;
        font: 16px/1.5 system-ui, sans-serif;
        color: var(--fg);
        background: var(--bg);
      }
      fieldset {
        border: 1px solid var(--border);
        border-radius: 6px;
        margin: 0 0 1rem;
      }
      label {
        display: block;
        margin: 0.5rem 0;
      }
      .row {
        display: flex;
        flex-wrap: wrap;
        align-items: baseline;
        gap: 0 1.5rem;
      }
      select {
        max-width: 100%;
      }
      .muted,
      footer {
        color: var(--muted);
        font-size: 0.875rem;
      }
      google-cast-launcher {
        display: inline-block;
        width: 32px;
        height: 32px;
        vertical-align: middle;
        cursor: pointer;
      }
      .warning {
        color: var(--error);
        font-size: 0.875rem;
      }
      label.inline {
        display: inline;
      }
      .progress {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 0.25rem 0.75rem;
        margin: 0.5rem 0;
      }
      .progress progress {
        flex: 1 1 12rem;
        max-width: 24rem;
      }
      .dot {
        display: inline-block;
        width: 0.75rem;
        height: 0.75rem;
        border-radius: 50%;
        background: var(--border);
        vertical-align: middle;
      }
      .dot.speaking {
        background: var(--ok);
      }
      .transcript {
        list-style: none;
        padding: 0;
      }
      .transcript li {
        margin: 0.25rem 0;
      }
      .transcript .dropped {
        text-decoration: line-through;
        opacity: 0.6;
      }
      .scene strong {
        font-size: 1.25rem;
        text-transform: capitalize;
      }
      .session {
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 0.75rem 1rem;
        margin: 0 0 1rem;
      }
      .start input[type="text"] {
        display: block;
        width: 100%;
        box-sizing: border-box;
        margin-top: 0.25rem;
        padding: 0.4rem;
        font: inherit;
      }
      button.primary {
        font: inherit;
        font-weight: 600;
        padding: 0.4rem 1rem;
      }
      .now p {
        margin: 0.35rem 0;
      }
      .now .scene strong {
        font-size: 1.5rem;
      }
      .now progress {
        vertical-align: middle;
        width: 10rem;
        max-width: 40%;
      }
      progress.countdown {
        width: 4rem;
        margin-left: 0.5rem;
      }
      h2 {
        font-size: 1.1rem;
        margin: 1.5rem 0 0.5rem;
      }
      .filters label {
        margin-right: 1rem;
      }
      .timeline {
        list-style: none;
        padding: 0;
        margin: 0;
      }
      .timeline li {
        display: grid;
        grid-template-columns: 4.75rem 1.75rem 1fr;
        gap: 0.25rem;
        padding: 0.35rem 0;
        border-bottom: 1px solid var(--border);
        overflow-wrap: anywhere;
      }
      .timeline .time {
        font: 0.8125rem ui-monospace, monospace;
        padding-top: 0.15rem;
      }
      .timeline .kind-speech .body {
        font-style: italic;
      }
      .timeline .dropped {
        text-decoration: line-through;
        opacity: 0.6;
      }
      .timeline pre {
        white-space: pre-wrap;
        font-size: 0.8125rem;
        margin: 0.25rem 0;
      }
      details {
        margin: 1rem 0;
      }
      summary {
        cursor: pointer;
      }
      .event-log {
        font: 0.8125rem/1.4 ui-monospace, monospace;
        padding-left: 1.25rem;
        overflow-wrap: anywhere;
      }
      .event-log .error {
        color: var(--error);
      }
      .event-log .playing,
      .event-log .ended {
        color: var(--ok);
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./main.js"></script>
  </body>
</html>
